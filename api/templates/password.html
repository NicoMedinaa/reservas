<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña</title>
    <link href="{{ url_for('static', filename='utils/estilos.css') }}" rel="stylesheet">
</head>
<body>
    <main>
        
        <p id="token">{{ token }}</p>
        <form action="" id="restablecer-contraseña">
            <input type="password" id="nuevaContraseña" placeholder="Introduce tu nueva contraseña">
            <input type="password" id="nuevaContraseña2" placeholder="Por favor repite tu contraseña">
            <button type="button" onclick="cambiarPass()">Restablecer</button>
        </form>

        <div id="emergente" class="modal" display="block">
            <div class="modal-content">
              <span class="close">&times;</span>
              <p id="errorMessage"></p>
            </div>
        </div>

    </main>
    <script src="{{ url_for('static', filename='utils/scripts.js') }}"></script>
</body>
</html>
